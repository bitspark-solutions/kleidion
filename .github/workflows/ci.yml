name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Go has no LTS: the two most recent stable releases (1.27.x, 1.26.x) get
  # security support. We track the newest. Node 24 is the active LTS (Krypton).
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24"

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/server/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run web:typecheck
      - name: Build
        run: npm run web:build

  compose-docker:
    name: Compose smoke test (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build images
        run: docker compose build
      - name: Boot stack
        run: docker compose up -d
      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18080/healthz >/dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          docker compose logs
          exit 1
      - name: Verify readiness (db reachable)
        run: curl -sf http://localhost:18080/readyz
      - name: Verify migrations applied
        run: |
          docker compose exec -T db psql -U kleidion -d kleidion -c '\dt' | grep -E 'users|devices|sessions'
      # `next dev` compiles the page on FIRST request, which takes longer than a
      # single curl's timeout — so retry instead of asserting once.
      - name: Verify web serves
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 30 http://localhost:13000 | grep -q Kleidion; then
              echo "web served on attempt ${i}"; exit 0
            fi
            sleep 5
          done
          docker compose logs web
          exit 1
      - name: Teardown
        if: always()
        run: docker compose down -v

  compose-podman:
    name: Compose smoke test (podman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install podman + podman-compose
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman podman-compose
          podman --version
          podman-compose --version
      - name: Validate compose file
        run: podman-compose config
      - name: Boot stack with podman
        run: podman-compose up -d --build
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/healthz >/dev/null; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          podman-compose logs
          exit 1
      - name: Verify readiness (db reachable)
        run: curl -sf http://localhost:18080/readyz
      - name: Verify migrations applied
        run: |
          podman exec kleidion_db_1 psql -U kleidion -d kleidion -c '\dt' | grep -E 'users|devices|sessions'
      - name: Verify auth routes wired
        # POST an empty body: a registered route reaches the handler and fails
        # validation with 400. Gin returns 404 (not 405) on method mismatch, so
        # GET-probing would be meaningless.
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18080/v1/auth/enroll -H 'Content-Type: application/json' -d '{}')
          [ "$code" = "400" ] || { echo "expected 400, got $code"; podman-compose logs server; exit 1; }
      - name: Verify web serves
        run: |
          for i in $(seq 1 30); do
            if curl -sf -m 30 http://localhost:13000 | grep -q Kleidion; then
              echo "web served on attempt ${i}"; exit 0
            fi
            sleep 5
          done
          podman-compose logs web
          exit 1
      - name: Teardown
        if: always()
        run: podman-compose down -v
